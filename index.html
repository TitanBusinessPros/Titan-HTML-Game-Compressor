<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Titan HTML Game Compressor</title>
<style>
:root{--bg:#0b1220;--panel:#121c2e;--line:#293750;--text:#eef4ff;--muted:#9fb0ca;--accent:#55aaff;--good:#66d49a;--bad:#ff8080}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}
.card{width:min(720px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 16px 50px #0007}
h1{margin:0 0 8px;font-size:28px}p{color:var(--muted);line-height:1.5}
.drop{border:2px dashed #425573;border-radius:12px;padding:30px;text-align:center;margin:22px 0}
input[type=file]{max-width:100%}
button{border:0;border-radius:9px;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer;background:var(--accent);color:#07111e;margin-right:8px}
button:disabled{opacity:.45;cursor:not-allowed}
#download{background:var(--good)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stat{background:#0c1525;border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{display:block;font-size:20px;margin-top:5px}
label,.small{font-size:13px;color:var(--muted)}
#status{min-height:24px;margin-top:16px}
.ok{color:var(--good)}.err{color:var(--bad)}
@media(max-width:600px){.stats{grid-template-columns:1fr}.card{padding:20px}}
</style>
</head>
<body>
<main class="card">
<h1>Titan HTML Game Compressor v3</h1>
<p>Compress old and new self-contained Titan game exports. The tool automatically detects the export format and uses lossless compression. Everything runs locally in your browser.</p>
<div class="drop">
  <input id="file" type="file" accept=".html,.htm,text/html">
  <p class="small">Your file is not uploaded anywhere.</p>
</div>
<div>
  <button id="compress" disabled>Compress HTML</button>
  <button id="download" disabled>Download Compressed File</button>
</div>
<div class="stats">
  <div class="stat"><label>Original</label><b id="original">—</b></div>
  <div class="stat"><label>Compressed</label><b id="final">—</b></div>
  <div class="stat"><label>Saved</label><b id="saved">—</b></div>
</div>
<div id="status"></div>
</main>
<script>
const fileInput=document.getElementById('file');
const compressBtn=document.getElementById('compress');
const downloadBtn=document.getElementById('download');
const statusEl=document.getElementById('status');
let selectedFile=null,outputBlob=null,outputName='compressed-game.html';

const fmt=n=>(n/1024/1024).toFixed(2)+' MiB';

fileInput.onchange=()=>{
 selectedFile=fileInput.files[0]||null; outputBlob=null;
 compressBtn.disabled=!selectedFile; downloadBtn.disabled=true;
 document.getElementById('original').textContent=selectedFile?fmt(selectedFile.size):'—';
 document.getElementById('final').textContent='—';
 document.getElementById('saved').textContent='—';
 statusEl.textContent='';
};

function b64ToBytes(b64){
 const bin=atob(b64), out=new Uint8Array(bin.length);
 for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
 return out;
}
function bytesToB64(bytes){
 let s='',chunk=0x8000;
 for(let i=0;i<bytes.length;i+=chunk)s+=String.fromCharCode(...bytes.subarray(i,i+chunk));
 return btoa(s);
}
async function gzipBytes(bytes){
 const stream=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
 return new Uint8Array(await new Response(stream).arrayBuffer());
}
function findAssignedObject(text, marker){
 const pos=text.indexOf(marker);
 if(pos<0)throw new Error(`Could not find "${marker.trim()}" in this file.`);
 let i=pos+marker.length,depth=0,inStr=false,esc=false,begin=-1;
 for(;i<text.length;i++){
   const c=text[i];
   if(inStr){if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')inStr=false;continue}
   if(c==='"'){inStr=true;continue}
   if(c==='{'){if(begin<0)begin=i;depth++}
   else if(c==='}'){depth--;if(depth===0&&begin>=0)return {markerPos:pos,start:begin,end:i+1,json:text.slice(begin,i+1)}}
 }
 throw new Error(`The object after "${marker.trim()}" is incomplete.`);
}
function findDataObject(text){ return findAssignedObject(text,'const DATA = '); }

async function compressNewDirectExport(text){
 const marker='window.GM_INLINE_CONFIG = ';
 const loc=findAssignedObject(text,marker);
 // Parse first: if this fails, don't modify the game.
 JSON.parse(loc.json);
 const raw=new TextEncoder().encode(loc.json);
 const gz=await gzipBytes(raw);
 const b64=bytesToB64(gz);

 // Keep the config compressed until loadConfig() asks for it.
 let out=text.slice(0,loc.markerPos)
   + `window.GM_INLINE_CONFIG_GZIP = "${b64}";`
   + text.slice(loc.end);

 // Remove the original assignment's trailing semicolon if still present.
 const afterMarkerEnd=loc.markerPos + (`window.GM_INLINE_CONFIG_GZIP = "${b64}";`).length;
 if(out.slice(afterMarkerEnd).startsWith(';')) out=out.slice(0,afterMarkerEnd)+out.slice(afterMarkerEnd+1);

 const helper=`
async function gmDecompressInlineConfig(b64) {
  const binary = atob(b64);
  const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return JSON.parse(await new Response(stream).text());
}
`;
 const loadNeedle='async function loadConfig() {';
 if(!out.includes(loadNeedle)) throw new Error('New-format game found, but its loadConfig() function was not found.');
 out=out.replace(loadNeedle,helper+'\n'+loadNeedle);

 const firstLine='  if (window.GM_INLINE_CONFIG) return window.GM_INLINE_CONFIG;';
 if(!out.includes(firstLine)) throw new Error('New-format loadConfig() is different from the supported exporter.');
 out=out.replace(firstLine,
`  if (window.GM_INLINE_CONFIG) return window.GM_INLINE_CONFIG;
  if (window.GM_INLINE_CONFIG_GZIP) return await gmDecompressInlineConfig(window.GM_INLINE_CONFIG_GZIP);`);

 // Preserve the downloaded-game Back safeguard in the new compressed format.
 out=out.replace(
'if (window.GM_INLINE_CONFIG && window.top === window) {',
'if ((window.GM_INLINE_CONFIG || window.GM_INLINE_CONFIG_GZIP) && window.top === window) {'
 );

 if(!out.includes('GM_INLINE_CONFIG_GZIP') || !out.includes('gmDecompressInlineConfig'))
   throw new Error('New-format safety validation failed.');
 return out;
}

function addDecoderAndLoader(text){
 const decoder=`function base64ToBytes(b64) {
  const binary = atob(b64);
  return Uint8Array.from(binary, (c) => c.charCodeAt(0));
}
async function gzipBase64ToText(b64) {
  const bytes = base64ToBytes(b64);
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(stream).text();
}`;

 // Replace the old synchronous Base64 decoder with gzip decoder helpers.
 const oldDecoder=/function base64ToText\(b64\)\s*\{[\s\S]*?return new TextDecoder\(\)\.decode\(bytes\);\s*\}/;
 if(oldDecoder.test(text)) text=text.replace(oldDecoder,decoder);
 else if(!text.includes('async function gzipBase64ToText('))
   throw new Error('Could not safely update the Base64 decoder.');

 // Newer wrapper generation: it preloads preparedHtml and dynamically creates iframe.
 if(text.includes('preparedStage') && text.includes('preparedHtml')){
   // Disable the old synchronous preload. gzip decompression is async, so loading happens
   // when Start Stage is pressed instead.
   const preload=/\n\s*\/\/ Decode while the player sees the cover,[\s\S]*?else setTimeout\(prepare,\s*0\);\s*/;
   if(preload.test(text)) text=text.replace(preload,'\n');

   const play=/function playStage\(i\)\s*\{[\s\S]*?showScreen\(['"]playScreen['"]\);\s*\}/;
   const m=text.match(play);
   if(!m) throw new Error('Could not safely update the newer stage loader.');
   const replacement=`async function playStage(i) {
  current = i;
  const iframe = document.createElement('iframe');
  iframe.id = 'stageFrame';
  iframe.title = DATA.stages[i].name;
  iframe.srcdoc = await gzipBase64ToText(DATA.stages[i].gzipB64);
  preparedHtml = null; preparedStage = -1;
  document.getElementById('playScreen').replaceChildren(iframe);
  showScreen('playScreen');
}`;
   text=text.replace(play,replacement);
   return text;
 }

 // Older wrapper generation.
 const oldPlay=/function playStage\(i\)\s*\{[\s\S]*?iframe\.srcdoc\s*=\s*base64ToText\(DATA\.stages\[i\]\.htmlB64\);[\s\S]*?showScreen\(['"]playScreen['"]\);\s*\}/;
 if(oldPlay.test(text)){
   const block=text.match(oldPlay)[0];
   let repl=block.replace('function playStage(i)', 'async function playStage(i)')
                 .replace('iframe.srcdoc = base64ToText(DATA.stages[i].htmlB64);',
                          'iframe.srcdoc = await gzipBase64ToText(DATA.stages[i].gzipB64);');
   text=text.replace(oldPlay,repl);
   return text;
 }

 // Flexible fallback: locate playStage and replace the srcdoc expression.
 const anyPlay=/function playStage\(i\)\s*\{[\s\S]*?\n\}/;
 const pm=text.match(anyPlay);
 if(pm && /iframe\.srcdoc\s*=/.test(pm[0])){
   let repl=pm[0].replace('function playStage(i)','async function playStage(i)');
   repl=repl.replace(/iframe\.srcdoc\s*=\s*[^;]+;/,
                     'iframe.srcdoc = await gzipBase64ToText(DATA.stages[i].gzipB64);');
   text=text.replace(pm[0],repl);
   return text;
 }

 throw new Error('Could not safely update the stage loader.');
}
function dedupeArt(data){
 const refs=[];
 if(typeof data.introArt==='string'&&data.introArt)refs.push({obj:data,key:'introArt',path:'DATA.introArt'});
 if(typeof data.outroArt==='string'&&data.outroArt)refs.push({obj:data,key:'outroArt',path:'DATA.outroArt'});
 if(Array.isArray(data.stages))data.stages.forEach((s,i)=>{
   if(typeof s.art==='string'&&s.art)refs.push({obj:s,key:'art',path:`DATA.stages[${i}].art`});
 });
 const first=new Map(),assign=[];
 for(const r of refs){
   const val=r.obj[r.key];
   if(first.has(val)){r.obj[r.key]='';assign.push(`${r.path} = ${first.get(val)};`)}
   else first.set(val,r.path);
 }
 return assign;
}

compressBtn.onclick=async()=>{
 try{
  if(!('CompressionStream'in window)||!('DecompressionStream'in window))
    throw new Error('Your browser does not support built-in gzip streams. Use a current Chrome or Edge browser.');
  statusEl.className='';statusEl.textContent='Detecting game format and compressing…';
  compressBtn.disabled=true;downloadBtn.disabled=true;
  const text=await selectedFile.text();
  let out,mode,count=0;

  if(text.includes('window.GM_INLINE_CONFIG = ')){
    mode='new';
    out=await compressNewDirectExport(text);
  } else if(text.includes('const DATA = ')){
    mode='old';
    const loc=findDataObject(text);
    const data=JSON.parse(loc.json);
    if(!Array.isArray(data.stages))throw new Error('No DATA.stages array found.');
    for(const stage of data.stages){
      if(stage.htmlB64){
        const raw=b64ToBytes(stage.htmlB64);
        const gz=await gzipBytes(raw);
        stage.gzipB64=bytesToB64(gz);
        delete stage.htmlB64; count++;
      }
    }
    if(!count)throw new Error('No uncompressed htmlB64 stages were found.');
    const assigns=dedupeArt(data);
    const json=JSON.stringify(data);
    const afterData=text.slice(loc.end);
    const semiOffset=afterData.indexOf(';');
    if(semiOffset<0)throw new Error('Could not find the end of the DATA declaration.');
    const suffix=afterData.slice(0,semiOffset+1)+'\n'+(assigns.length?assigns.join('\n')+'\n':'')+afterData.slice(semiOffset+1);
    out=text.slice(0,loc.start)+json+suffix;
    out=addDecoderAndLoader(out);
    if(!out.includes('</html>')||!out.includes('gzipBase64ToText'))
      throw new Error('Old-format safety check failed.');
  } else {
    throw new Error('This does not match either supported Titan export format.');
  }

  if(!out.includes('<!DOCTYPE html>') || !out.includes('</html>'))
    throw new Error('Final HTML safety check failed; no output file was created.');

  outputBlob=new Blob([out],{type:'text/html'});
  outputName=selectedFile.name.replace(/\.html?$/i,'')+'-compressed.html';
  document.getElementById('final').textContent=fmt(outputBlob.size);
  const saved=selectedFile.size-outputBlob.size;
  document.getElementById('saved').textContent=fmt(saved)+' ('+(saved/selectedFile.size*100).toFixed(1)+'%)';
  statusEl.className='ok';
  statusEl.textContent=mode==='new'
    ? 'Done. New direct-export format detected. The inline game configuration was compressed losslessly and the loader was updated automatically.'
    : `Done. Old wrapper format detected. Compressed ${count} stage${count===1?'':'s'} losslessly and reused identical artwork where possible.`;
  downloadBtn.disabled=false;
 }catch(e){
  statusEl.className='err';statusEl.textContent='Error: '+e.message;
 }finally{compressBtn.disabled=false}
};
downloadBtn.onclick=()=>{
 if(!outputBlob)return;
 const a=document.createElement('a');
 a.href=URL.createObjectURL(outputBlob);a.download=outputName;a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
</script>
</body>
</html>
